{
  "name": "observation-downloader",
  "python_requires": ">=3.9",
  "standard_library": [
    "argparse", "concurrent.futures", "datetime", "importlib.util", "json",
    "os", "pathlib", "subprocess", "sys", "urllib.parse", "urllib.request"
  ],
  "packages": [
    {
      "distribution": "PyYAML",
      "requirement": "PyYAML>=6.0,<7.0",
      "import_name": "yaml",
      "purpose": "Read YAML source profiles"
    },
    {
      "distribution": "certifi",
      "requirement": "certifi>=2024.0.0",
      "import_name": "certifi",
      "purpose": "Provide a portable HTTPS certificate bundle"
    }
  ]
}
