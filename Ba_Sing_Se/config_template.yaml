# The downloader lists the ASDC month directory and selects every file for --day.
datasets:
  l2-05km-apro:
    directory_url_template: "https://asdc.larc.nasa.gov/data/CALIPSO/LID_L2_05kmAPro-Standard-V4-51/{YYYY}/{MM}/"
    filename_prefix: "CAL_LID_L2_05kmAPro-Standard-V4-51"

  l1:
    directory_url_template: "https://asdc.larc.nasa.gov/data/CALIPSO/LID_L1-Standard-V5-00/{YYYY}/{MM}/"
    filename_prefix: "CAL_LID_L1-Standard-V5-00"

  l0:
    # CMR lists the actual filename/timestamp for every L0 granule on --day.
    virtual_directory_template: "https://cmr.earthdata.nasa.gov/virtual-directory/collections/C3880519029-LARC_CLOUD/temporal/{YYYY}/{MM}/{DD}"
    extension: ".hdf"
